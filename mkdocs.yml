# Documentation as a website: https://firsttris.github.io/chrome.sendtokodi/
# Source is docs/, built with MkDocs Material (.github/workflows/docs.yml).
# Locally: pip install -r requirements-docs.txt && mkdocs serve
site_name: SendToKodi · Browser Extension
site_description: >-
  SendToKodi is a browser extension for Chrome, Firefox and Edge that sends
  videos from YouTube, Twitch, Vimeo and 1000+ other websites to Kodi with one
  click. Play or queue the current tab, use the context menu or a keyboard
  shortcut, manage several Kodi devices. No tracking, no server in between.
site_url: https://firsttris.github.io/chrome.sendtokodi/
repo_url: https://github.com/firsttris/chrome.sendtokodi
repo_name: firsttris/chrome.sendtokodi
edit_uri: edit/master/docs/
copyright: >-
  MIT License · Kodi is a trademark of the XBMC Foundation. Chrome, Firefox
  and Edge are trademarks of their owners. This project is not affiliated with any of them.

docs_dir: docs
# Pages as setup.html instead of setup/: relative image paths of the <img> tags
# then work the same on the site and on GitHub
use_directory_urls: false

nav:
  - Overview: README.md
  - Users:
      - Installation: installation.md
      - Setup: setup.md
      - Usage: usage.md
      - Troubleshooting: troubleshooting.md
      - Privacy & permissions: privacy.md
  - Background:
      - How it works: how-it-works.md
      - Development: development.md
      - Releases: releases.md

theme:
  name: material
  language: en
  logo: assets/icon.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Follows the system setting, switchable
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      type: date
      locale: en
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/firsttris/chrome.sendtokodi
      name: Source code on GitHub
    - icon: fontawesome/brands/chrome
      link: https://chrome.google.com/webstore/detail/sendtokodi/gbcpfpcacakaadapjcdchbdmdnfbnbaf
      name: Chrome Web Store
    - icon: fontawesome/brands/firefox-browser
      link: https://addons.mozilla.org/firefox/addon/sendtokodi/
      name: Mozilla Add-ons
    - icon: fontawesome/brands/edge
      link: https://microsoftedge.microsoft.com/addons/detail/sendtokodi/cfaaejdnkempodfadjkjfblimmakeaij
      name: Microsoft Edge Add-ons
