name: Release

# A tag vX.Y.Z (the button in bump.yml or npm run release:patch|minor|major) publishes that
# version: the checks and both builds from check_build.yml, then the shared GitHub release and
# store upload from firsttris/workflows. Started by hand on an existing tag, it publishes that
# version again, to the stores ticked below; on master it only runs the checks.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      chrome:
        description: Upload to Chrome Web Store
        type: boolean
        default: true
      firefox:
        description: Publish to Mozilla Add-ons
        type: boolean
        default: true
      edge:
        description: Publish to Microsoft Edge Add-ons
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/check_build.yml

  release:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    uses: firsttris/workflows/.github/workflows/github-release.yml@v1
    with:
      release-artifact: extension
    permissions:
      contents: write

  stores:
    needs: release
    uses: firsttris/workflows/.github/workflows/browser-extension-stores.yml@v1
    with:
      name: sendToKodi
      firefox-addon-guid: sendtokodi@firsttris.github.io
      # A tag push has no inputs: then every store
      chrome: ${{ github.event_name == 'push' || inputs.chrome }}
      firefox: ${{ github.event_name == 'push' || inputs.firefox }}
      edge: ${{ github.event_name == 'push' || inputs.edge }}
    secrets: inherit
