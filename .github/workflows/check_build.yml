name: Check Build

# Changes to documentation alone don't build.
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  # The release workflow runs the same checks and publishes the packages built here
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & format
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build Chrome extension
        run: npm run build

      - name: Package Chrome extension
        run: (cd dist && zip -qr "../sendToKodi-chrome-$(node -p "require('../package.json').version").zip" .)

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Package Firefox extension
        run: (cd dist && zip -qr "../sendToKodi-firefox-$(node -p "require('../package.json').version").zip" .)

      - name: Lint Firefox extension
        run: npx --yes web-ext@10 lint --source-dir dist

      # Installable from a pull request; the release attaches them and uploads them to the stores
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: sendToKodi-*.zip
          if-no-files-found: error
